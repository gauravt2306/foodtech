# Fly.io configuration for FoodTech API
app = "foodtech-api"
primary_region = "lax"  # Los Angeles - closest to Oregon PostgreSQL

[build]
  dockerfile = "FoodTech.Api/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  JwtSettings__Issuer = "foodtech-api"
  JwtSettings__Audience = "foodtech-app"
  JwtSettings__AccessTokenExpiryMinutes = "60"
  # PostgreSQL connection string (set via flyctl secrets set)
  # PostgreSql__ConnectionString = "postgresql://foodtech_7rat_user:4ZRyeEcTkCABnVXw91kL3r5LwUfbEnMs@dpg-dbsjd8lg1s2s73fc72d0-a.oregon-postgres.render.com/foodtech_7rat"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[health_checks]
  interval = "30s"
  timeout = "10s"
  method = "GET"
  path = "/health"
  grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# PostgreSQL: Use existing Render PostgreSQL (set via secrets)
# flyctl secrets set PostgreSql__ConnectionString="postgresql://foodtech_7rat_user:4ZRyeEcTkCABnVXw91kL3r5LwUfbEnMs@dpg-dbsjd8lg1s2s73fc72d0-a.oregon-postgres.render.com/foodtech_7rat"